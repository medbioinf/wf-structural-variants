name: "PIPELINE_INITIALISATION"
description: Utility subworkflow providing pipeline initialisation (samplesheet validation, parameter checks) and completion (email, summary) functionality specific to the medbioinf/pangenomesv pipeline.
keywords:
  - utility
  - pipeline
  - initialisation
  - completion
components:
  - completionemail
  - completionsummary
  - utils_nextflow_pipeline
  - utils_nfcore_pipeline
  - utils_nfschema_plugin
input:
  - version:
      type: boolean
      description: Display version and exit.
  - validate_params:
      type: boolean
      description: Whether to validate parameters against the schema at runtime.
output:
  - samplesheet:
      type: file
      description: Validated samplesheet channel.
  - versions:
      type: file
      description: File containing software versions used in the subworkflow.
authors:
  - "@jonahKps"