name: "swave_annotation"
description: Annotates called structural variants with repeat content (TRF) and, optionally, gene/exon overlap (ANNOVAR), then filters the resulting VCF into rare, infrequent, and frequent allele-frequency tiers, published directly to the output directory.
keywords:
  - annotation
  - repeat-annotation
  - annovar
  - filtering
components:
  - swave/extract_variant_sequences
  - swave/split_variant_sequences
  - trf
  - swave/annotate_vcf_with_trf
  - annovar
  - htslib/bgziptabix
  - bcftools/filter
input:
  - ch_vcf:
      type: file
      description: VCF to annotate with repeat content, optionally with ANNOVAR, and filter by allele frequency.
  - ch_gfa_fasta:
      type: file
      description: Node FASTA file of the pangenome graph, as produced by gfatools gfa2fa, used to reconstruct variant sequences for TRF annotation.
output:
  - versions:
      type: file
      description: File containing software versions used in the subworkflow.
authors:
  - "@jonahKps"